name: LimitRoad France Picardie cross OS
on:
  push:
    branches: [ limitroad-france-rebuild-20260902 ]
    paths: [ '.github/workflows/limitroad-france-picardie-crossos.yml' ]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Download Picardie PBF on Windows egress
        shell: pwsh
        run: |
          curl.exe -4 -fL --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 60 "https://download.geofabrik.de/europe/france/picardie-latest.osm.pbf" -o picardie.osm.pbf
          $s=(Get-Item picardie.osm.pbf).Length
          Write-Host "bytes=$s"
          if ($s -lt 100000000) { throw "PBF too small" }
      - uses: actions/upload-artifact@v4
        with:
          name: picardie-pbf-transfer
          path: picardie.osm.pbf
          retention-days: 1
          compression-level: 0
  build:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: limitroad-france-rebuild-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check osmium==4.3.1
      - uses: actions/download-artifact@v4
        with:
          name: picardie-pbf-transfer
          path: input
      - name: Patch, generate, validate
        run: |
          python - <<'PY'
          p='limitroad-france-rebuild/generate_region.py'
          s=open(p,encoding='utf-8').read()
          needle="        if highway not in ALLOWED_HIGHWAYS:\n            return\n"
          repl=needle+"        if (w.tags.get('access') or '').lower() in ('private','no'):\n            return\n"
          open(p,'w',encoding='utf-8').write(s.replace(needle,repl,1))
          PY
          mkdir -p out
          python limitroad-france-rebuild/generate_region.py input/picardie.osm.pbf out/picardie.sqlite picardie --data-version 02.09.2026
          python - <<'PY'
          import sqlite3,os
          p='out/picardie.sqlite'; c=sqlite3.connect(p)
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          r=c.execute('select count(*) from roads').fetchone()[0]; s=c.execute('select count(*) from segments').fetchone()[0]
          assert r>1000 and s>1000
          print(os.path.getsize(p),r,s)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LimitRoad-France-picardie-crossos-20260902
          path: out/picardie.sqlite
          retention-days: 7
          compression-level: 0
