name: Temporary WakeTime SDK Export
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/waketime-sdk-export.yml'
jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - name: Download SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          mkdir -p bundle
          cp "$ANDROID_HOME/platforms/android-35/android.jar" bundle/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" bundle/build-tools
          tar -cf waketime-android-sdk.tar -C bundle .
      - name: Export toolchain
        uses: actions/upload-artifact@v4
        with:
          name: waketime-android-sdk-35
          path: waketime-android-sdk.tar
          compression-level: 1
          retention-days: 2
