name: Cartes Organizer Android 0.2.0 Native & Auto Pairing
on:
  push:
    branches: [main]
    paths:
      - 'cartes-organizer-native-020/**'
      - '.github/workflows/cartes-organizer-native-020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore exact native sources
        shell: bash
        run: |
          set -euo pipefail
          base64 -d cartes-organizer-native-020/build-project.zip.b64 > /tmp/co-native.zip
          mkdir -p android-native
          unzip -q /tmp/co-native.zip -d android-native
          test -f android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          test -f android-native/app/src/main/res/drawable-nodpi/cartes_icon.png
          grep -Fq 'mobile/pair' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          grep -Fq 'cartesorganizer' android-native/app/src/main/AndroidManifest.xml
      - name: Build native debug APK
        run: gradle --no-daemon -p android-native :app:assembleDebug
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-native/app/build/outputs/apk/debug/app-debug.apk dist/Cartes-Organizer-Android-0.2.0.apk
          (cd android-native && zip -qr ../dist/Cartes-Organizer-Android-0.2.0-sources.zip . -x '*/build/*' '.gradle/*')
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs dist/Cartes-Organizer-Android-0.2.0.apk > dist/APK-SIGNATURE.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging dist/Cartes-Organizer-Android-0.2.0.apk | head -5 > dist/APK-BADGING.txt
          sha256sum dist/Cartes-Organizer-Android-0.2.0.apk > dist/SHA256SUMS.txt
          printf 'versionName=0.2.0\nversionCode=3\nwordpressPlugin=0.3.9\nneedsInitialSessionPairing=yes\nwebview=no\n' > dist/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cartes-Organizer-Android-0.2.0-native
          path: dist/*
          retention-days: 30
          if-no-files-found: error
