name: Build PiiWii TV Phone 0.5.0 from tar

on:
  push:
    branches: [ piiwii-tv-phone-050 ]
    paths:
      - '.github/workflows/build-piiwii-tv-phone-050-tar.yml'
      - 'piiwii-tv-phone-050-ci/PiiWii-TV-Phone-0.5.0-Sources.tar.xz'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect and extract exact 0.5.0 archive
        shell: bash
        run: |
          set -euo pipefail
          ARCH='piiwii-tv-phone-050-ci/PiiWii-TV-Phone-0.5.0-Sources.tar.xz'
          test -s "$ARCH"
          echo "Archive SHA-256: $(sha256sum "$ARCH" | awk '{print $1}')"
          xz -t "$ARCH"
          mkdir -p /tmp/piiwii050
          tar -xJf "$ARCH" -C /tmp/piiwii050
          echo '--- archive tree ---'
          find /tmp/piiwii050 -maxdepth 4 -type f | sort | sed -n '1,200p'
          PROJECT=$(find /tmp/piiwii050 -type f -path '*/app/build.gradle' -printf '%h\n' | sed 's#/app$##' | head -n1)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"
          grep -R -n "versionName\|versionCode\|applicationId" "$PROJECT/app/build.gradle"
          grep -q "versionName '0.5.0'" "$PROJECT/app/build.gradle"
          grep -q 'versionCode 5' "$PROJECT/app/build.gradle"
          if grep -R -n 'android.webkit.WebView\|<WebView' "$PROJECT/app/src/main"; then
            echo 'WebView detected: refusing native build'
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate installable APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/PiiWii-TV-Phone-0.5.0.apk
          unzip -t out/PiiWii-TV-Phone-0.5.0.apk | tee out/unzip.txt
          "$BT/zipalign" -c -v 4 out/PiiWii-TV-Phone-0.5.0.apk | tee out/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs out/PiiWii-TV-Phone-0.5.0.apk | tee out/apksigner.txt
          "$BT/aapt" dump badging out/PiiWii-TV-Phone-0.5.0.apk | tee out/badging.txt
          grep -F "package: name='ch.piiwii.tvphone'" out/badging.txt
          grep -F "versionCode='5'" out/badging.txt
          grep -F "versionName='0.5.0'" out/badging.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' out/apksigner.txt
          sha256sum out/PiiWii-TV-Phone-0.5.0.apk | tee out/PiiWii-TV-Phone-0.5.0.sha256
          {
            echo 'PiiWii TV Phone 0.5.0 - build validation'
            echo
            echo 'Source archive:'
            sha256sum piiwii-tv-phone-050-ci/PiiWii-TV-Phone-0.5.0-Sources.tar.xz 2>/dev/null || true
            echo
            cat out/PiiWii-TV-Phone-0.5.0.sha256
            echo
            cat out/badging.txt
            echo
            cat out/apksigner.txt
            echo
            cat out/zipalign.txt
          } > out/PiiWii-TV-Phone-0.5.0-AUDIT.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.5.0
          path: out/*
          retention-days: 14
          if-no-files-found: error
