name: SpookLink Android 2.1.1 - Pairing Recovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spooklink-android-211.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore sources and apply tested recovery
        run: |
          base64 -d spooklink2/build/android-2.1.0.zip.b64 > project.zip
          unzip -q project.zip
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java')
          s=p.read_text()
          patches=[
            ('JSONObject ack=post(address,"/v2/connect",payload,"");',
             'JSONObject ack=post(address,"/v2/connect",payload,prefs.getString("token_"+address,""));'),
            ('status.setMaxLines(2);','status.setMaxLines(3);'),
            ('Connexion refusée : ','Connexion impossible : ')
          ]
          for before,after in patches:
              if before not in s:raise RuntimeError('Expected Android source not found: '+before)
              s=s.replace(before,after,1)
          s=s.replace('status("Connexion impossible : "+e.getMessage(),false);',
            'status(e.getMessage()!=null&&(e.getMessage().contains("ancien identifiant")||e.getMessage().contains("déjà associé")) ? "Le PC garde une ancienne association. Sur Windows : clic droit sur SpookLink près de l heure > Réinitialiser le téléphone associé, puis réessayer." : "Connexion impossible : "+e.getMessage(),false);')
          s=s.replace('SpookLink 2.1:', 'SpookLink 2.1.1:')
          s=s.replace('TextView ver=text("2.1",12','TextView ver=text("2.1.1",12')
          p.write_text(s)
          g=Path('android/app/build.gradle')
          source=g.read_text()
          assert 'versionCode 9' in source and "versionName '2.1.0'" in source
          g.write_text(source.replace('versionCode 9','versionCode 10').replace("versionName '2.1.0'","versionName '2.1.1'"))
          print('Reassociation recovery enabled; Android versionCode 10')
          PY
      - name: Build unsigned release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-2.1.1-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
