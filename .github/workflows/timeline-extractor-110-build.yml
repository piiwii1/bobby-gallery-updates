name: PiiWii Timeline Extractor 1.1.0 APK

on:
  push:
    branches: [ main ]
    paths:
      - 'build-input/timeline110.part*.b64'
      - '.github/workflows/timeline-extractor-110-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild sources
        shell: bash
        run: |
          set -e
          cat build-input/timeline110.part*.b64 | base64 -d > PiiWii-Timeline-Extractor-1.1.0-Sources.zip
          rm -rf timeline-build
          mkdir -p timeline-build
          unzip -q PiiWii-Timeline-Extractor-1.1.0-Sources.zip -d timeline-build

      - name: Build installable APK
        working-directory: timeline-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package delivery
        shell: bash
        run: |
          set -e
          mkdir -p out
          cp timeline-build/app/build/outputs/apk/debug/app-debug.apk out/PiiWii-Timeline-Extractor-1.1.0.apk
          cp PiiWii-Timeline-Extractor-1.1.0-Sources.zip out/
          sha256sum out/PiiWii-Timeline-Extractor-1.1.0.apk > out/SHA256.txt
          sha256sum out/PiiWii-Timeline-Extractor-1.1.0-Sources.zip >> out/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Timeline-Extractor-1.1.0
          path: out/*
          retention-days: 7
          if-no-files-found: error
