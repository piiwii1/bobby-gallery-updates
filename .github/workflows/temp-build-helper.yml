name: Temporary Bobby build helper

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-build-helper.yml'

permissions:
  contents: write

jobs:
  export-tools:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Android tool bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-tool-bundle
          mkdir -p android-tool-bundle/build-tools/lib android-tool-bundle/build-tools/lib64
          BT="$ANDROID_HOME/build-tools/35.0.0"
          AJ="$ANDROID_HOME/platforms/android-35/android.jar"
          cp "$BT/aapt2" android-tool-bundle/build-tools/
          cp "$BT/zipalign" android-tool-bundle/build-tools/
          cp "$BT/d8" android-tool-bundle/build-tools/
          cp "$BT/apksigner" android-tool-bundle/build-tools/
          cp "$BT/lib/d8.jar" android-tool-bundle/build-tools/lib/
          cp "$BT/lib/apksigner.jar" android-tool-bundle/build-tools/lib/
          cp "$BT/lib64/libc++.so" android-tool-bundle/build-tools/lib64/
          cp "$AJ" android-tool-bundle/android-35.jar
          chmod +x android-tool-bundle/build-tools/aapt2 android-tool-bundle/build-tools/zipalign android-tool-bundle/build-tools/d8 android-tool-bundle/build-tools/apksigner
      - name: Upload Android tool bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-with-libcxx
          path: android-tool-bundle
          retention-days: 1
          compression-level: 9
      - name: Publish run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p temp-tools
          printf '%s\n' "$GITHUB_RUN_ID" > temp-tools/run-id.txt
          printf 'ARTIFACT_READY_LIBCXX\n' > temp-tools/status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A temp-tools
          git commit -m 'Temporary Android SDK artifact with libc++ ready [skip release]'
          git push
