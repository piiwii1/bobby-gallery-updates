name: Temporary Bobby build helper

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-build-helper.yml'

permissions:
  contents: write

jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write marker
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m-%dT%H:%M:%SZ > actions-marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add actions-marker.txt
          git commit -m 'Temporary build helper marker [skip release]'
          git push
