name: PiiWii Remote Clean 2.3.0 direct build
on:
  push:
    paths:
      - 'piiwii-remote-clean230/**'
      - '.github/workflows/piiwii-remote-clean230-direct.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: piiwii-remote-clean230
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p out
          cp piiwii-remote-clean230/app/build/outputs/apk/debug/app-debug.apk out/PiiWii-Remote-Clean-2.3.0-clean1.apk
          sha256sum out/PiiWii-Remote-Clean-2.3.0-clean1.apk | tee out/SHA256.txt
          cd piiwii-remote-clean230 && zip -qr ../out/PiiWii-Remote-Clean-2.3.0-clean1-SOURCES.zip . -x 'app/build/*' '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Remote-Clean-2.3.0-clean1
          path: out/*
