name: LimitRoad Redeliver France Full
on:
  push:
    branches: [ limitroad-france-rebuild-20260902 ]
    paths: [ '.github/workflows/limitroad-redeliver-france-full.yml' ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        include:
          - { slug: alsace, url: 'https://download.geofabrik.de/europe/france/alsace-latest.osm.pbf' }
          - { slug: aquitaine, url: 'https://download.geofabrik.de/europe/france/aquitaine-latest.osm.pbf' }
          - { slug: auvergne, url: 'https://download.geofabrik.de/europe/france/auvergne-latest.osm.pbf' }
          - { slug: basse-normandie, url: 'https://download.geofabrik.de/europe/france/basse-normandie-latest.osm.pbf' }
          - { slug: bourgogne, url: 'https://download.geofabrik.de/europe/france/bourgogne-latest.osm.pbf' }
          - { slug: bretagne, url: 'https://download.geofabrik.de/europe/france/bretagne-latest.osm.pbf' }
          - { slug: centre, url: 'https://download.geofabrik.de/europe/france/centre-latest.osm.pbf' }
          - { slug: champagne-ardenne, url: 'https://download.geofabrik.de/europe/france/champagne-ardenne-latest.osm.pbf' }
          - { slug: corse, url: 'https://download.geofabrik.de/europe/france/corse-latest.osm.pbf' }
          - { slug: franche-comte, url: 'https://download.geofabrik.de/europe/france/franche-comte-latest.osm.pbf' }
          - { slug: haute-normandie, url: 'https://download.geofabrik.de/europe/france/haute-normandie-latest.osm.pbf' }
          - { slug: ile-de-france, url: 'https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf' }
          - { slug: languedoc-roussillon, url: 'https://download.geofabrik.de/europe/france/languedoc-roussillon-latest.osm.pbf' }
          - { slug: limousin, url: 'https://download.geofabrik.de/europe/france/limousin-latest.osm.pbf' }
          - { slug: lorraine, url: 'https://download.geofabrik.de/europe/france/lorraine-latest.osm.pbf' }
          - { slug: midi-pyrenees, url: 'https://download.geofabrik.de/europe/france/midi-pyrenees-latest.osm.pbf' }
          - { slug: nord-pas-de-calais, url: 'https://download.geofabrik.de/europe/france/nord-pas-de-calais-latest.osm.pbf' }
          - { slug: pays-de-la-loire, url: 'https://download.geofabrik.de/europe/france/pays-de-la-loire-latest.osm.pbf' }
          - { slug: picardie, url: 'https://download.openstreetmap.fr/extracts/europe/france/picardie-latest.osm.pbf' }
          - { slug: poitou-charentes, url: 'https://download.geofabrik.de/europe/france/poitou-charentes-latest.osm.pbf' }
          - { slug: provence-alpes-cote-d-azur, url: 'https://download.geofabrik.de/europe/france/provence-alpes-cote-d-azur-latest.osm.pbf' }
          - { slug: rhone-alpes, url: 'https://download.geofabrik.de/europe/france/rhone-alpes-latest.osm.pbf' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: limitroad-france-rebuild-20260902 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install --disable-pip-version-check osmium==4.3.1
      - name: Patch recovered access filter
        shell: bash
        run: |
          python - <<'PY'
          p='limitroad-france-rebuild/generate_region.py'
          s=open(p,encoding='utf-8').read()
          needle="        if highway not in ALLOWED_HIGHWAYS:\n            return\n"
          if "w.tags.get('access')" not in s:
              s=s.replace(needle,needle+"        if (w.tags.get('access') or '').lower() in ('private','no'):\n            return\n",1)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Download OSM extract
        shell: bash
        run: curl -fL --retry 12 --retry-all-errors --retry-delay 8 --connect-timeout 60 '${{ matrix.url }}' -o region.osm.pbf
      - name: Generate SQLite
        shell: bash
        run: |
          python limitroad-france-rebuild/generate_region.py region.osm.pbf '${{ matrix.slug }}.sqlite' '${{ matrix.slug }}' --data-version 02.09.2026
          python - <<'PY'
          import sqlite3,glob
          p=glob.glob('*.sqlite')[0]; c=sqlite3.connect(p)
          assert c.execute('pragma integrity_check').fetchone()[0]=='ok'
          print(p,c.execute('select count(*) from roads').fetchone()[0],c.execute('select count(*) from segments').fetchone()[0])
          c.close()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fr-${{ matrix.slug }}
          path: ${{ matrix.slug }}.sqlite
          retention-days: 7
          compression-level: 0
  assemble:
    needs: region
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: limitroad-france-rebuild-20260902 }
      - uses: actions/download-artifact@v4
        with:
          pattern: fr-*
          path: db
          merge-multiple: true
      - name: Verify 22 DBs
        run: |
          test "$(find db -name '*.sqlite' | wc -l)" -eq 22
          python - <<'PY'
          import glob,sqlite3
          for p in sorted(glob.glob('db/*.sqlite')):
              c=sqlite3.connect(p); assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; c.close(); print('OK',p)
          PY
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build binary Android shell
        run: |
          cd limitroad-france-rebuild/android-shell
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../../../shell.apk
      - name: Assemble full APK
        shell: bash
        run: |
          rm -rf apkdir && mkdir apkdir
          cd apkdir
          unzip -q ../shell.apk
          rm -rf META-INF classes.dex
          base64 -d ../limitroad-france-rebuild/FranceMapProvider.classes.dex.b64 > classes.dex
          mkdir -p assets/regions
          cp ../db/*.sqlite assets/regions/
          cd ..
          rm -f LimitRoad-Map-France-02.09.2026-unsigned.apk
          (cd apkdir && zip -1 -q -r ../LimitRoad-Map-France-02.09.2026-unsigned.apk .)
          unzip -tq LimitRoad-Map-France-02.09.2026-unsigned.apk
          ls -lh LimitRoad-Map-France-02.09.2026-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LimitRoad-Map-France-02.09.2026-unsigned
          path: LimitRoad-Map-France-02.09.2026-unsigned.apk
          retention-days: 7
          compression-level: 0
