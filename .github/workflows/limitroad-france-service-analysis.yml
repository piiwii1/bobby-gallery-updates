name: LimitRoad France service filter analysis
on:
  push:
    branches: [ limitroad-france-rebuild-20260902 ]
    paths: [ '.github/workflows/limitroad-france-service-analysis.yml' ]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: limitroad-france-rebuild-20260902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check osmium==4.3.1
      - run: curl -fL --retry 4 --retry-delay 5 'https://download.geofabrik.de/europe/france/alsace-260820.osm.pbf' -o alsace.osm.pbf
      - name: Count service subtypes
        run: |
          python - <<'PY'
          import osmium,collections,json
          class H(osmium.SimpleHandler):
            def __init__(self): super().__init__(); self.c=collections.Counter(); self.access=collections.Counter()
            def way(self,w):
              if w.tags.get('highway')=='service':
                self.c[w.tags.get('service') or '(none)']+=1
                self.access[w.tags.get('access') or '(none)']+=1
          h=H(); h.apply_file('alsace.osm.pbf')
          d={'service':h.c.most_common(),'access':h.access.most_common(),'total':sum(h.c.values())}
          open('service-analysis.json','w').write(json.dumps(d,indent=2)); print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LimitRoad-France-service-analysis
          path: service-analysis.json
          retention-days: 7
