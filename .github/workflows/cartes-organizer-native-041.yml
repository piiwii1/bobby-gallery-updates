name: Cartes Organizer Android 0.4.1 — Vertical native dashboard
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cartes-organizer-native-041.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare native project
        run: |
          set -euo pipefail
          base64 -d cartes-organizer-native-040/project.zip.b64 > /tmp/cartes040.zip
          mkdir -p android-native
          unzip -q /tmp/cartes040.zip -d android-native
          grep -Fq 'versionName '\''0.4.0'\''' android-native/app/build.gradle
          grep -Fq 'slotCooldownMillis' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          grep -Fq 'server_manifest_040' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          if grep -R -n 'android.webkit.WebView' android-native/app/src/main; then exit 1; fi
      - name: Build native APK
        run: |
          # Correct a JSONArray length accessor in the generated source.
          sed -i 's/a("cards").length==0/a("cards").length()==0/g' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          blob=Path('cartes-organizer-native-041/patch.zlib.b64').read_text().strip()
          Path('/tmp/co041.patch').write_bytes(zlib.decompress(base64.b64decode(blob)))
          PY
          patch --batch --forward -p1 -d android-native < /tmp/co041.patch
          grep -q "versionName '0.4.1'" android-native/app/build.gradle
          grep -q "friendOverviewRow" android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          if grep -q "HorizontalScrollView" android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java; then echo 'Unexpected horizontal scrolling'; exit 1; fi
          gradle --no-daemon -p android-native :app:assembleDebug
      - name: Verify APK and package sources
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-native/app/build/outputs/apk/debug/app-debug.apk dist/Cartes-Organizer-Android-0.4.1.apk
          (cd android-native && zip -q -r ../dist/Cartes-Organizer-Android-0.4.1-sources.zip app/src/main app/build.gradle build.gradle settings.gradle)
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Cartes-Organizer-Android-0.4.1.apk > dist/APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Cartes-Organizer-Android-0.4.1.apk | head -8 > dist/APK-INFO.txt
          sha256sum dist/Cartes-Organizer-Android-0.4.1.apk > dist/SHA256SUMS.txt
          printf 'versionName=0.4.1\nversionCode=9\nplugin=0.3.8\nsite=https://piiwii.ch\nwebview=no\nrequiresFirstAuthorization=yes\n' > dist/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cartes-Organizer-Android-0.4.1
          path: dist/*
          retention-days: 30
