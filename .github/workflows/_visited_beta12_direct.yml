name: Visited beta12 direct APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/_visited_beta12_direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build beta12
        working-directory: _piiwii_visited_build
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publish direct APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _visited_beta12_direct
          APK="_piiwii_visited_build/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" _visited_beta12_direct/Visited-1.0.0-beta12-PREVIEW.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs _visited_beta12_direct/Visited-1.0.0-beta12-PREVIEW.apk
          sha256sum _visited_beta12_direct/Visited-1.0.0-beta12-PREVIEW.apk > _visited_beta12_direct/Visited-1.0.0-beta12-PREVIEW.sha256
          git config user.name "ChatGPT Build"
          git config user.email "actions@users.noreply.github.com"
          git add _visited_beta12_direct
          git commit -m "Publish direct Visited beta12 APK"
          git push origin main
