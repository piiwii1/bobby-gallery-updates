name: PiiWii TV Phone 0.4.0

on:
  push:
    branches: [ piiwii-tv-phone-040 ]
    paths:
      - 'piiwii-tv-phone-040-ci/**'
      - 'piiwii-tv-phone-040-tail/**'
      - '.github/workflows/piiwii-tv-phone-040.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35 from preinstalled SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore 0.4.0 source
        run: |
          set -euo pipefail
          {
            cat piiwii-tv-phone-040-ci/src.part00
            cat piiwii-tv-phone-040-ci/src.part01
            cat piiwii-tv-phone-040-ci/src.part02
            cat piiwii-tv-phone-040-tail/tail.part00
            cat piiwii-tv-phone-040-tail/tail.part01
            cat piiwii-tv-phone-040-tail/tail.part02
            cat piiwii-tv-phone-040-tail/tail.part03
            cat piiwii-tv-phone-040-tail/tail.part04
          } | base64 --decode > /tmp/piiwii-tv-phone-0.4.0.zip
          echo '0c317305987b5d564a4a7732557b57a27feddd36254ed4c33423ac0199a5e6db  /tmp/piiwii-tv-phone-0.4.0.zip' | sha256sum -c -
          unzip -t /tmp/piiwii-tv-phone-0.4.0.zip
          unzip -q /tmp/piiwii-tv-phone-0.4.0.zip
          test -f piiwii-tv-phone-0.4.0/app/build.gradle
          test -f piiwii-tv-phone-0.4.0/app/src/main/java/ch/piiwii/tvphone/EpgRepository.java
          grep -q "versionName '0.4.0'" piiwii-tv-phone-0.4.0/app/build.gradle
          grep -q 'versionCode 4' piiwii-tv-phone-0.4.0/app/build.gradle
          grep -q 'Guide TV' piiwii-tv-phone-0.4.0/app/src/main/java/ch/piiwii/tvphone/MainActivity.java
          grep -q 'Direct' piiwii-tv-phone-0.4.0/app/src/main/java/ch/piiwii/tvphone/MainActivity.java
          grep -q 'Réglages' piiwii-tv-phone-0.4.0/app/src/main/java/ch/piiwii/tvphone/MainActivity.java
          grep -q 'SystemBars.attach' piiwii-tv-phone-0.4.0/app/src/main/java/ch/piiwii/tvphone/MainActivity.java
          if grep -R -n 'android.webkit.WebView\|<WebView' piiwii-tv-phone-0.4.0/app/src/main; then
            echo 'WebView detected: refusing native build'
            exit 1
          fi
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > piiwii-tv-phone-0.4.0/gradle.properties

      - name: Build native APK
        working-directory: piiwii-tv-phone-0.4.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate build
        run: |
          set -euo pipefail
          APK='piiwii-tv-phone-0.4.0/app/build/outputs/apk/debug/app-debug.apk'
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/zipalign" -c -v 4 "$APK" > zipalign.txt
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='ch.piiwii.tvphone'" badging.txt
          grep -F "versionCode='4'" badging.txt
          grep -F "versionName='0.4.0'" badging.txt
          unzip -t "$APK" > unzip.txt
          mkdir -p out
          cp "$APK" out/PiiWii-TV-Phone-0.4.0-debug.apk
          sha256sum out/PiiWii-TV-Phone-0.4.0-debug.apk > out/debug.sha256
          {
            echo 'PiiWii TV Phone 0.4.0 debug build validation'
            echo 'Native Android; no WebView.'
            echo 'Guide TV: native EPG via /wp-json/geektv/v1/epg?hours=54.'
            echo 'Bottom navigation: Direct / Guide / Réglages.'
            echo 'SystemBars/WindowInsets preserved.'
            echo
            cat badging.txt
            echo
            cat zipalign.txt
            echo
            cat unzip.txt
          } > out/PiiWii-TV-Phone-0.4.0-BUILD.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.4.0-debug
          path: out/*
          retention-days: 14
          if-no-files-found: error
