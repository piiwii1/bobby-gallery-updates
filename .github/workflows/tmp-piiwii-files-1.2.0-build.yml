name: Temporary PiiWii Files 1.2.0 Build

on:
  push:
    branches:
      - tmp-piiwii-files-1.2.0-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          cat tmp-piiwii-files-1.2.0/project.zip.b64.part* > /tmp/piiwii-files.zip.b64
          base64 -d /tmp/piiwii-files.zip.b64 > /tmp/piiwii-files.zip
          echo "5a10a7abcb5800ce9bf68e23cc9f86c19df85261e69cbc6d01f072ffb23973e7  /tmp/piiwii-files.zip" | sha256sum -c -
          mkdir -p /tmp/piiwii-files
          unzip -q /tmp/piiwii-files.zip -d /tmp/piiwii-files

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: /tmp/piiwii-files
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/piiwii-files/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh /tmp/piiwii-files/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Files-1.2.0-unsigned
          path: /tmp/piiwii-files/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
