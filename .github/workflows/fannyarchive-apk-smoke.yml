name: FannyArchive APK Smoke Test

on:
  push:
    branches: [ fannyarchive-apk-verify-temp ]
    paths:
      - '.github/workflows/fannyarchive-apk-smoke.yml'
      - 'fannyarchive-apk-test-trigger.txt'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/fannyarchive-apk-smoke.yml'
      - 'fannyarchive-apk-test-trigger.txt'

jobs:
  verify-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Download compiled APK
        run: |
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-0b8c-81f4-8520-858e745702ff/raw?se=2026-08-24T12%3A33%3A54Z&sp=r&sv=2026-02-06&sr=b&scid=e1224865-1bf6-5b8d-93ca-40fdebc4eb8b&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-24T08%3A22%3A36Z&ske=2026-08-25T08%3A22%3A36Z&sks=b&skv=2026-02-06&sig=W2S7weWAyDFSENAX6VKN5WkrfdSo6nuU2rZJeNxpKsA%3D' -o /tmp/fanny.zip
          unzip -q /tmp/fanny.zip -d /tmp/fanny
          test -f /tmp/fanny/FannyArchive-1.3.0-debug.apk
          echo '7bcfcebf496b66ebc030dd36ecedf2ffc4f2a0ab915ae605cd11aca2c393b2d9  /tmp/fanny/FannyArchive-1.3.0-debug.apk' | sha256sum -c -

      - name: Install launch and verify Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            adb install -r /tmp/fanny/FannyArchive-1.3.0-debug.apk > /tmp/install.txt 2>&1; cat /tmp/install.txt; grep -q 'Success' /tmp/install.txt
            adb logcat -c
            adb shell am force-stop ch.piiwii.fannyarchive
            adb shell am start -W -n ch.piiwii.fannyarchive/.MainActivity | tee /tmp/start.txt
            grep -q 'Status: ok' /tmp/start.txt
            sleep 8
            adb shell pidof ch.piiwii.fannyarchive | tee /tmp/pid.txt
            test -s /tmp/pid.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
            grep -F 'Archive Fanny' /tmp/window.xml
            ! adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|AndroidRuntime' | grep -F 'ch.piiwii.fannyarchive'
            adb exec-out screencap -p > /tmp/FannyArchive-1.3.0-launch.png

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: FannyArchive-1.3.0-ANDROID15-VERIFIED
          path: |
            /tmp/fanny/FannyArchive-1.3.0-debug.apk
            /tmp/FannyArchive-1.3.0-launch.png
            /tmp/start.txt
            /tmp/pid.txt
          retention-days: 7
