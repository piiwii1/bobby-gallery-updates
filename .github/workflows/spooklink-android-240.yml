name: SpookLink Android 2.4.0 ergonomic update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/spooklink-android-240.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble native SpookLink Android project
        run: |
          base64 -d spooklink2/build/android-2.1.0.zip.b64 > project.zip
          unzip -q project.zip
          python3 - <<'PY'
          from pathlib import Path
          import base64,lzma
          src=Path('spooklink2/build/android-2.4.0.java.xz.b64').read_text().strip()
          java=lzma.decompress(base64.b64decode(src))
          assert b'R\xc3\x89GLAGES DES PERSONNAGES' in java
          assert b'R\xc3\x89GLAGES DES MESSAGES' in java
          target=Path('android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java')
          target.write_bytes(java)
          res=Path('android/app/src/main/res/drawable-nodpi')
          res.mkdir(parents=True,exist_ok=True)
          png=base64.b64decode(Path('spooklink2/build/android-2.4.0-icon.png.b64').read_text().strip())
          assert png[:8]==b'\x89PNG\r\n\x1a\n'
          (res/'ic_spooklink.png').write_bytes(png)
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          manifest.write_text(manifest.read_text().replace('android:label="SpookLink"','android:label="SpookLink" android:icon="@drawable/ic_spooklink"'))
          gradle=Path('android/app/build.gradle')
          old=gradle.read_text()
          assert 'versionCode 9' in old
          gradle.write_text(old.replace('versionCode 9','versionCode 13').replace("versionName '2.1.0'","versionName '2.4.0'"))
          print('App source',len(java),'icon',len(png))
          PY
      - name: Compile release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-2.4.0-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
