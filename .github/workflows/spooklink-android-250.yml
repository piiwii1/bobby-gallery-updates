name: SpookLink Android 2.5.0 - Native UI redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spooklink-android-250.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/download-artifact@v4
        with:
          run-id: 40785998447
          github-token: ${{ github.token }}
          name: SpookLink-Android-2.4.0-unsigned
          path: previous-apk
      - name: Rebuild unchanged Windows-compatible Android protocol and restore prior icon
        run: |
          base64 -d spooklink2/build/android-2.1.0.zip.b64 > project.zip
          unzip -q project.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import struct
          old=Path('previous-apk/app-release-unsigned.apk')
          assert old.exists(), 'Previous APK absent'
          with ZipFile(old) as z:
              icons=[]
              for name in z.namelist():
                  if name.endswith('.png'):
                      data=z.read(name)
                      w,h=struct.unpack('>II',data[16:24])
                      if (w,h)==(96,96):icons.append(data)
              assert len(icons)==1,'Could not identify existing ghost launcher icon'
          icon=Path('android/app/src/main/res/drawable-nodpi/ic_spooklink.png')
          icon.write_bytes(icons[0])
          src=Path('spooklink2/android/v2.5.0/MainActivity.java')
          assert src.exists() and 'private void buildEmojis()' in src.read_text()
          dst=Path('android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java')
          dst.write_bytes(src.read_bytes())
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          m=manifest.read_text().replace('android:label="SpookLink"','android:label="SpookLink" android:icon="@drawable/ic_spooklink"')
          manifest.write_text(m)
          cfg=Path('android/app/build.gradle')
          c=cfg.read_text()
          assert 'versionCode 9' in c
          cfg.write_text(c.replace('versionCode 9','versionCode 14').replace("versionName '2.1.0'","versionName '2.5.0'"))
          PY
      - name: Compile release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-2.5.0-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

# Build-source syntax correction verified.
