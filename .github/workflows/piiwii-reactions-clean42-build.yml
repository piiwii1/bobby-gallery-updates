name: PiiWii Reactions 1.2.1 Build
on:
  push:
    branches: [piiwii-reactions-clean42-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare project
        run: |
          rm -rf build-piiwii
          mkdir build-piiwii
          unzip -q piiwii-reactions-clean42-build/PiiWii-Reactions-1.2.1-42-SOURCE-BUILD.zip -d build-piiwii
      - name: Build unsigned release
        working-directory: build-piiwii
        run: gradle --no-daemon :app:assembleRelease
      - name: Align APK
        run: |
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/zipalign" -f -p 4 build-piiwii/app/build/outputs/apk/release/app-release-unsigned.apk PiiWii-Reactions-1.2.1-42-aligned-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Reactions-1.2.1-42
          path: PiiWii-Reactions-1.2.1-42-aligned-unsigned.apk
          if-no-files-found: error
