name: SpookLink 2 Clean Android APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spooklink2-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare fresh Android 2.0 app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,zipfile,io
          old=Path('.github/workflows/_spooklink_android_1_0_0.yml').read_text()
          match=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > source.zip",old)
          if not match:raise RuntimeError("Android scaffolding unavailable")
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(match.group(1)))) as z:z.extractall('.')
          Path('android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java').write_bytes(Path('spooklink2/android/MainActivity.java').read_bytes())
          f=Path('android/app/build.gradle')
          text=f.read_text().replace('versionCode 1','versionCode 8').replace("versionName '1.0.0'","versionName '2.0.0'").replace('targetSdk 35','targetSdk 34')
          f.write_text(text)
          print("SpookLink 2.0 source files ready",len(Path('spooklink2/android/MainActivity.java').read_bytes()))
          PY
      - name: Build installable Android APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Upload unsigned APK for permanent signing
        uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-2.0.0-Unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
