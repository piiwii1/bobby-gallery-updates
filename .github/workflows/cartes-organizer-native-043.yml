name: Cartes Organizer Android 0.4.3 — horizontal layout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cartes-organizer-native-043.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare independent native Android project
        run: |
          set -euo pipefail
          base64 -d cartes-organizer-native-043/project.zip.b64 > /tmp/cartes043.zip
          mkdir -p android-native
          unzip -q /tmp/cartes043.zip -d android-native
          grep -q "versionName '0.4.3'" android-native/app/build.gradle
          grep -q 'HorizontalScrollView pager' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          grep -q 'slotCooldownMillis' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          if grep -R -q 'android.webkit.WebView' android-native/app/src/main; then exit 1; fi
      - name: Build native release APK to be signed with permanent key
        run: gradle --no-daemon -p android-native :app:assembleRelease
      - name: Deliver APK and signer utility
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-native/app/build/outputs/apk/release/app-release-unsigned.apk dist/Cartes-Organizer-Android-0.4.3-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          (cd android-native && zip -qr ../dist/Cartes-Organizer-Android-0.4.3-sources.zip app/src/main app/build.gradle build.gradle settings.gradle)
          sha256sum dist/Cartes-Organizer-Android-0.4.3-temp.apk > dist/BUILD-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cartes-Organizer-Android-0.4.3-build
          path: dist/*
          retention-days: 30
