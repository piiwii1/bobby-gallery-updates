name: PiiWii TV Sony beta12 temp build

on:
  push:
    branches: [ main ]
    paths:
      - 'temp-piiwii-tv-sony-beta12/BUILD_TRIGGER.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore and patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/piiwii-base-parts /tmp/piiwii-tv-sony-beta12
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-00?token=CJE3DTSYTENIPVQSO3TYYM3KWQOY3AA' -o /tmp/piiwii-base-parts/part-00
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-01?token=CJE3DTWY5H2JWKJ6QZ7SFNDKWQOY3AA' -o /tmp/piiwii-base-parts/part-01
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-02?token=CJE3DTRXIT7D3TTILROPGWDKWQOY3AA' -o /tmp/piiwii-base-parts/part-02
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-03?token=CJE3DTWM4HPTRQXY4Y2Q7JDKWQOY3AA' -o /tmp/piiwii-base-parts/part-03
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-04?token=CJE3DTUBKYR7VIU4PICXJP3KWQOY3AA' -o /tmp/piiwii-base-parts/part-04
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-05?token=CJE3DTXZDNSHL62Z5DCR2YLKWQOY3AA' -o /tmp/piiwii-base-parts/part-05
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-06?token=CJE3DTQRQ2I4YDGC3NTZKBDKWQOY3AA' -o /tmp/piiwii-base-parts/part-06
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-07?token=CJE3DTXPLNICACHKBRR7XALKWQOY3AA' -o /tmp/piiwii-base-parts/part-07
          curl -L --fail --silent --show-error 'https://raw.githubusercontent.com/piiwii1/wpab-builds/chatgpt/piiwii-tv-sony-beta10/piiwii-tv-sony/source.zip.b64.part-08?token=CJE3DTRXE2AZAHBSGVWYEELKWQOY3AA' -o /tmp/piiwii-base-parts/part-08
          cat /tmp/piiwii-base-parts/part-* | base64 -d > /tmp/base.zip
          echo '1117c564d26aa781f506b6ef3477f99e2eb49e418a82aeed389ec51e68e22163  /tmp/base.zip' | sha256sum -c -
          unzip -q /tmp/base.zip -d /tmp/piiwii-tv-sony-beta12
          (cd /tmp/piiwii-tv-sony-beta12 && patch -p1 < "$GITHUB_WORKSPACE/temp-piiwii-tv-sony-beta12/beta12.patch")
          grep -q 'versionCode = 12' /tmp/piiwii-tv-sony-beta12/app/build.gradle.kts
          grep -q 'OVERLAY_TIMEOUT_MS = 4000L' /tmp/piiwii-tv-sony-beta12/app/src/main/java/ch/piiwii/tv/sony/PlayerActivity.java
          grep -q 'TF1 Séries Films' /tmp/piiwii-tv-sony-beta12/app/src/main/java/ch/piiwii/tv/sony/BraviaWebActivity.java
          ! grep -q 'surface.setBackgroundColor(Color.BLACK)' /tmp/piiwii-tv-sony-beta12/app/src/main/java/ch/piiwii/tv/sony/PlayerActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build beta12
        working-directory: /tmp/piiwii-tv-sony-beta12
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp /tmp/piiwii-tv-sony-beta12/app/build/outputs/apk/debug/app-debug.apk delivery/PiiWii-TV-Sony-Bravia-1.0.0-beta12-CI.apk
          (cd /tmp/piiwii-tv-sony-beta12 && zip -qr "$GITHUB_WORKSPACE/delivery/PiiWii-TV-Sony-Bravia-1.0.0-beta12-SOURCES.zip" . -x 'app/build/*' '.gradle/*')
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/PiiWii-TV-Sony-Bravia-1.0.0-beta12-CI.apk > delivery/CI-SIGNATURE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Sony-beta12-delivery
          path: delivery/
          retention-days: 1
          if-no-files-found: error
