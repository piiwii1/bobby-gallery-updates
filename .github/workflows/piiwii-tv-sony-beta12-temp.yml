name: PiiWii TV Sony beta12 temp build

on:
  push:
    branches: [ main ]
    paths:
      - 'temp-piiwii-tv-sony-beta12/BUILD_TRIGGER.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/piiwii-tv-sony-beta12
          cat temp-piiwii-tv-sony-beta12/source.zip.b64.part-* | base64 -d > /tmp/source.zip
          echo '462157eca20bff81a210b2d76fa07f17616270381afc7157d9fa5e68b40cc325  /tmp/source.zip' | sha256sum -c -
          unzip -q /tmp/source.zip -d /tmp/piiwii-tv-sony-beta12
          grep -q 'versionCode = 12' /tmp/piiwii-tv-sony-beta12/app/build.gradle.kts
          grep -q 'OVERLAY_TIMEOUT_MS = 4000L' /tmp/piiwii-tv-sony-beta12/app/src/main/java/ch/piiwii/tv/sony/PlayerActivity.java
          grep -q 'TF1 Séries Films' /tmp/piiwii-tv-sony-beta12/app/src/main/java/ch/piiwii/tv/sony/BraviaWebActivity.java
          ! grep -q 'surface.setBackgroundColor(Color.BLACK)' /tmp/piiwii-tv-sony-beta12/app/src/main/java/ch/piiwii/tv/sony/PlayerActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build beta12
        working-directory: /tmp/piiwii-tv-sony-beta12
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Prepare delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          cp /tmp/piiwii-tv-sony-beta12/app/build/outputs/apk/debug/app-debug.apk delivery/PiiWii-TV-Sony-Bravia-1.0.0-beta12-CI.apk
          cp /tmp/source.zip delivery/PiiWii-TV-Sony-Bravia-1.0.0-beta12-SOURCES.zip
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs delivery/PiiWii-TV-Sony-Bravia-1.0.0-beta12-CI.apk > delivery/CI-SIGNATURE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Sony-beta12-delivery
          path: delivery/
          retention-days: 1
          if-no-files-found: error
