name: PiiWii Store 1.0.0 Clean Build

on:
  push:
    branches: [ piiwii-store-100-build ]
    paths:
      - 'piiwii-store-clean/**'
      - '.github/workflows/piiwii-store-100-clean-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check preinstalled Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$ROOT"
          test -f "$ROOT/platforms/android-35/android.jar"
          test -x "$ROOT/build-tools/35.0.0/aapt"
          test -f "$ROOT/build-tools/35.0.0/lib/apksigner.jar"
          echo "ANDROID_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Expand verified clean project
        shell: bash
        run: |
          set -euo pipefail
          base64 -d piiwii-store-clean/project.zip.b64 > /tmp/piiwii-store-project.zip
          echo "e0e4755c41b6cf4e8aea9b02462f6a70ab738273a170810bf27ad3a9dd652788  /tmp/piiwii-store-project.zip" | sha256sum -c -
          mkdir -p piiwii-store-clean/project
          unzip -q /tmp/piiwii-store-project.zip -d piiwii-store-clean/project

      - name: Build unsigned release APK
        working-directory: piiwii-store-clean/project
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify package and prepare local-signing bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$ANDROID_SDK_ROOT"
          APK=piiwii-store-clean/project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -1 | tee /tmp/badging.txt
          grep -q "package: name='ch.piiwii.store2'" /tmp/badging.txt
          grep -q "versionCode='1'" /tmp/badging.txt
          grep -q "versionName='1.0.0'" /tmp/badging.txt
          mkdir -p out
          cp "$APK" out/PiiWii-Store-1.0.0-unsigned.apk
          cp "$ROOT/build-tools/35.0.0/lib/apksigner.jar" out/apksigner.jar
          cp "$ROOT/build-tools/35.0.0/zipalign" out/zipalign
          cp "$ROOT/build-tools/35.0.0/aapt" out/aapt
          cp "$ROOT/build-tools/35.0.0/lib64/libc++.so" out/libc++.so || true
          chmod +x out/zipalign out/aapt
          sha256sum out/* > out/SHA256SUMS.txt

      - name: Upload build bundle
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Store-1.0.0-clean-unsigned
          path: out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
