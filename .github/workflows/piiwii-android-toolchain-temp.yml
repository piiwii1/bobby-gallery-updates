name: PiiWii Android Toolchain Temp

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/piiwii-android-toolchain-temp.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Locate Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$ROOT"
          BT="$ROOT/build-tools/35.0.0"
          if [ ! -d "$BT" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          fi
          PLATFORM="$ROOT/platforms/android-35/android.jar"
          mkdir -p out
          cp "$BT/aapt2" out/aapt2
          cp "$BT/aapt" out/aapt
          cp "$BT/zipalign" out/zipalign
          cp "$BT/lib/d8.jar" out/d8.jar
          cp "$BT/lib/apksigner.jar" out/apksigner.jar
          cp "$PLATFORM" out/android.jar
          chmod +x out/aapt out/aapt2 out/zipalign
          sha256sum out/* > out/SHA256SUMS.txt
          ls -lh out
          java -cp out/d8.jar com.android.tools.r8.D8 --version
          java -cp out/apksigner.jar com.android.apksigner.ApkSignerTool --version

      - name: Upload Android toolchain
        uses: actions/upload-artifact@v4
        with:
          name: piiwii-android35-toolchain
          path: out/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

# retrigger 2026-09-19 for PiiWii Store 1.6.0
