name: Cartes Organizer Android 0.4.7 — Fix WhatsApp photo handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cartes-organizer-native-047.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore existing 0.4.4 project
        run: |
          set -euo pipefail
          base64 -d cartes-organizer-native-044/project.zip.b64 > /tmp/cartes044.zip
          mkdir -p android-native
          unzip -q /tmp/cartes044.zip -d android-native
          grep -Fq "versionName '0.4.4'" android-native/app/build.gradle
      - name: Apply native UI corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib
          z=Path('cartes-organizer-native-045/update.patch.zlib.b64').read_text().strip()
          Path('/tmp/update.patch').write_bytes(zlib.decompress(base64.b64decode(z)))
          PY
          patch --batch -p1 -d android-native < /tmp/update.patch
          grep -Fq "versionName '0.4.5'" android-native/app/build.gradle
          grep -Fq 'friendPhotoSlot' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          grep -Fq 'ScrollView vertical' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          if grep -Fq 'TextView all=text("Tout afficher' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java; then exit 1; fi
      - name: Enlarge rectangular logo without stretching
        run: |
          cat > /tmp/GrowCartesLogo.java <<'JAVA'
          import java.awt.*;
          import java.awt.image.*;
          import java.io.*;
          import javax.imageio.ImageIO;
          public class GrowCartesLogo {
            public static void main(String[] args) throws Exception {
              File file=new File(args[0]);
              BufferedImage in=ImageIO.read(file);
              int l=in.getWidth(),t=in.getHeight(),r=0,b=0;
              for(int y=0;y<in.getHeight();y++)for(int x=0;x<in.getWidth();x++){
                if(((in.getRGB(x,y)>>>24)&255)<16)continue;
                l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y);
              }
              int width=332;int height=(int)Math.round(width*(b-t+1.0)/(r-l+1.0));
              BufferedImage out=new BufferedImage(432,432,BufferedImage.TYPE_INT_ARGB);
              Graphics2D g=out.createGraphics();
              g.setRenderingHint(RenderingHints.KEY_INTERPOLATION,RenderingHints.VALUE_INTERPOLATION_BICUBIC);
              g.drawImage(in,(432-width)/2,(432-height)/2,(432+width)/2,(432+height)/2,l,t,r+1,b+1,null);
              g.dispose();ImageIO.write(out,"png",file);
            }
          }
          JAVA
          javac /tmp/GrowCartesLogo.java
          java -cp /tmp GrowCartesLogo android-native/app/src/main/res/drawable-nodpi/cartes_icon.png
      - name: Add native WhatsApp recipient associations and polished menus
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib
          z=Path('cartes-organizer-native-046/update.patch.zlib.b64').read_text().strip()
          Path('/tmp/co046.patch').write_bytes(zlib.decompress(base64.b64decode(z)))
          PY
          patch --batch -p1 -d android-native < /tmp/co046.patch
          sed -i "s/versionCode 13/versionCode 14/; s/versionName '0.4.5'/versionName '0.4.6'/" android-native/app/build.gradle
          grep -Fq "versionName '0.4.6'" android-native/app/build.gradle
          grep -Fq 'normalizePhone' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          grep -Fq 'shareToWhatsApp' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
      - name: Fix WhatsApp image transfer and verify photo provider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib
          data=Path('cartes-organizer-native-047/update.patch.zlib.b64').read_text().strip()
          Path('/tmp/cartes047.patch').write_bytes(zlib.decompress(base64.b64decode(data)))
          PY
          patch --batch -p1 -d android-native < /tmp/cartes047.patch
          grep -Fq "versionName '0.4.7'" android-native/app/build.gradle
          grep -Fq "versionCode 15" android-native/app/build.gradle
          grep -Fq 'grantUriPermission(pkg,imageUri' android-native/app/src/main/java/ch/piiwii/cartesorganizer/MainActivity.java
          grep -Fq 'image/jpeg' android-native/app/src/main/java/ch/piiwii/cartesorganizer/ShareProvider.java
          if grep -R -n 'android.webkit.WebView' android-native/app/src/main; then exit 1; fi
      - name: Compile release APK
        run: gradle --no-daemon -p android-native :app:assembleRelease
      - name: Package installable APK source and signing tools
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-native/app/build/outputs/apk/release/app-release-unsigned.apk dist/Cartes-Organizer-Android-0.4.7-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/apksigner.jar
          (cd android-native && zip -qr ../dist/Cartes-Organizer-Android-0.4.7-sources.zip app/src/main app/build.gradle build.gradle settings.gradle)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/Cartes-Organizer-Android-0.4.7-unsigned.apk | head -8 > dist/APK-INFO.txt
          sha256sum dist/Cartes-Organizer-Android-0.4.7-unsigned.apk > dist/BUILD-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cartes-Organizer-Android-0.4.7-build
          path: dist/*
          retention-days: 30
