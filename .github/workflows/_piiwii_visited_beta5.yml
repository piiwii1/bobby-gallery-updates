name: PiiWii Visited beta5 Build

on:
  push:
    branches: [ main ]
    paths:
      - '_piiwii_visited_build/**'
      - '.github/workflows/_piiwii_visited_beta5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        working-directory: _piiwii_visited_build
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Export APK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tools
          cp _piiwii_visited_build/app/build/outputs/apk/release/app-release-unsigned.apk out/PiiWii-Visited-1.0.0-beta5-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" out/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" out/tools/
          cp -a "$ANDROID_HOME/build-tools/35.0.0/lib" out/tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib64/libc++_shared.so" out/tools/ 2>/dev/null || true
          chmod +x out/tools/apksigner out/tools/zipalign
          sha256sum out/PiiWii-Visited-1.0.0-beta5-unsigned.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Visited-1.0.0-beta5-unsigned-and-tools
          path: out/
          retention-days: 1
          if-no-files-found: error
