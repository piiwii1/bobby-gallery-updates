name: PiiWii TV Phone 0.3.0

on:
  push:
    branches: [ piiwii-tv-phone-030 ]
    paths:
      - 'piiwii-tv-phone-030-ci/**'
      - '.github/workflows/piiwii-tv-phone-030.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35 from preinstalled SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore 0.3.0 source
        run: |
          set -euo pipefail
          cat piiwii-tv-phone-030-ci/src.part* | base64 -d > /tmp/piiwii-tv-phone.tar.gz
          tar -xzf /tmp/piiwii-tv-phone.tar.gz
          test -f piiwii-tv-phone-0.3.0/app/build.gradle
          grep -q "versionName '0.3.0'" piiwii-tv-phone-0.3.0/app/build.gradle
          grep -q 'versionCode 3' piiwii-tv-phone-0.3.0/app/build.gradle
          grep -q 'SystemBars.attach' piiwii-tv-phone-0.3.0/app/src/main/java/ch/piiwii/tvphone/MainActivity.java
          grep -q 'setImmersive' piiwii-tv-phone-0.3.0/app/src/main/java/ch/piiwii/tvphone/PlayerActivity.java
          if grep -R -n 'android.webkit.WebView\|<WebView' piiwii-tv-phone-0.3.0/app/src/main; then
            echo 'WebView detected: refusing native build'
            exit 1
          fi
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > piiwii-tv-phone-0.3.0/gradle.properties

      - name: Build native APK
        working-directory: piiwii-tv-phone-0.3.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate build
        run: |
          set -euo pipefail
          APK='piiwii-tv-phone-0.3.0/app/build/outputs/apk/debug/app-debug.apk'
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/zipalign" -c -v 4 "$APK" > zipalign.txt
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='ch.piiwii.tvphone'" badging.txt
          grep -F "versionCode='3'" badging.txt
          grep -F "versionName='0.3.0'" badging.txt
          unzip -t "$APK" > unzip.txt
          mkdir -p out
          cp "$APK" out/PiiWii-TV-Phone-0.3.0-debug.apk
          sha256sum out/PiiWii-TV-Phone-0.3.0-debug.apk > out/debug.sha256

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.3.0-debug
          path: out/*
          retention-days: 14
          if-no-files-found: error
