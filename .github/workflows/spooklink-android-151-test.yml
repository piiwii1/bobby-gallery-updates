name: SpookLink Android 1.5.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/spooklink-android-151-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Configure Android
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - name: Restore project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,re,zipfile,io
          p=Path('.github/workflows/_spooklink_android_1_0_0.yml').read_text()
          m=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > source.zip",p)
          assert m
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(m.group(1)))) as z:z.extractall('.')
          dest=Path('android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java')
          dest.write_text(Path('spooklink/android/v1.3.0/MainActivity.java').read_text())
          config=Path('android/app/build.gradle')
          config.write_text(config.read_text().replace('versionCode 1','versionCode 6').replace("versionName '1.0.0'","versionName '1.5.1'"))
          PY
      - name: Build APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-1.5.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
