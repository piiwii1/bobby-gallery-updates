name: SpookLink Android APK 1.1.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_spooklink_android_1_0_0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> $GITHUB_ENV
          echo '/usr/local/lib/android/sdk/cmdline-tools/latest/bin' >> $GITHUB_PATH
      - name: Install API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack SpookLink source
        run: |
          echo '' | base64 -d > source.zip
          unzip -q source.zip
          echo '' | base64 -d | xz -dc > android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java
          sed -i "s/versionCode 1/versionCode 2/;s/versionName '1.0.0'/versionName '1.1.0'/" android/app/build.gradle
      - name: Compile APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename deliverable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpookLink-Android-1.1.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-1.1.0
          path: SpookLink-Android-1.0.0.apk
          retention-days: 14
