name: SpookLink Android 1.1.0 deliver
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/spooklink-android-deliver.yml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo ANDROID_HOME=/usr/local/lib/android/sdk >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore approved Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, zipfile, io, lzma
          data=Path(".github/workflows/_spooklink_android_1_0_0.yml").read_text()
          source=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > source.zip",data)
          patch=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| xz -dc >",data)
          if not source or not patch: raise RuntimeError("Missing source payload")
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(source.group(1)))) as archive:archive.extractall('.')
          Path("android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java").write_bytes(lzma.decompress(base64.b64decode(patch.group(1))))
          path=Path("android/app/build.gradle")
          path.write_text(path.read_text().replace("versionCode 1","versionCode 2").replace("versionName '1.0.0'","versionName '1.1.0'"))
          PY
      - name: Compile
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Save APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpookLink-Android-1.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-1.1.0
          path: SpookLink-Android-1.1.0.apk
          if-no-files-found: error
