name: PiiWii Linux - runner verification
on:
  push:
    branches: [piiwii-linux-iso-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify runner and disk
        run: |
          echo "PiiWii Linux runner is running"
          df -h /
          uname -a
          curl -fILsS --max-time 30 https://pub.linuxmint.io/stable/22.3/sha256sum.txt
