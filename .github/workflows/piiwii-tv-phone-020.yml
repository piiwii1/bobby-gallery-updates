name: PiiWii TV Phone 0.2.0

on:
  push:
    branches: [ piiwii-tv-phone-020h ]
    paths:
      - 'piiwii-tv-phone-ci/**'
      - '.github/workflows/piiwii-tv-phone-020.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android 35 from preinstalled SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fresh source
        run: |
          set -euo pipefail
          cat piiwii-tv-phone-ci/src.part* | base64 -d > /tmp/piiwii-tv-phone.tar.gz
          tar -xzf /tmp/piiwii-tv-phone.tar.gz
          test -f piiwii-tv-phone-0.2.0/app/build.gradle
          grep -q "versionName '0.2.0'" piiwii-tv-phone-0.2.0/app/build.gradle
          grep -q 'androidx.media3:media3-exoplayer-hls:1.7.1' piiwii-tv-phone-0.2.0/app/build.gradle
          printf '%s\n' 'android.useAndroidX=true' 'android.enableJetifier=false' > piiwii-tv-phone-0.2.0/gradle.properties
          if grep -R -n 'android.webkit.WebView\|<WebView' piiwii-tv-phone-0.2.0/app/src/main; then
            echo 'WebView detected: refusing native build'
            exit 1
          fi

      - name: Build native Media3 APK
        working-directory: piiwii-tv-phone-0.2.0
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK
        run: |
          set -euo pipefail
          APK='piiwii-tv-phone-0.2.0/app/build/outputs/apk/debug/app-debug.apk'
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          "$BT/zipalign" -c -v 4 "$APK" | tee zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' apksigner.txt
          "$BT/aapt" dump badging "$APK" | tee badging.txt
          grep -F "package: name='ch.piiwii.tvphone'" badging.txt
          grep -F "versionCode='2'" badging.txt
          grep -F "versionName='0.2.0'" badging.txt
          unzip -t "$APK" | tee unzip.txt
          mkdir -p out
          cp "$APK" out/PiiWii-TV-Phone-0.2.0.apk
          sha256sum out/PiiWii-TV-Phone-0.2.0.apk | tee out/PiiWii-TV-Phone-0.2.0.sha256
          {
            echo 'PiiWii TV Phone 0.2.0 — build validation'
            echo 'Fresh native project; no WebView.'
            echo 'Player: AndroidX Media3 / ExoPlayer HLS 1.7.1.'
            echo 'Channel API: sources + headers + PiiWii proxy fallback.'
            echo
            cat badging.txt
            echo
            cat apksigner.txt
            echo
            cat zipalign.txt
            echo
            cat unzip.txt
          } > out/PiiWii-TV-Phone-0.2.0-AUDIT.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.2.0
          path: out/*
          retention-days: 14
          if-no-files-found: error
