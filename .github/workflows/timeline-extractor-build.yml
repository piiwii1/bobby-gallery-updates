name: PiiWii Timeline Extractor APK

on:
  push:
    branches: [ main ]
    paths:
      - 'build-input/PiiWii-Timeline-Extractor-1.0.0-Sources.zip'
      - '.github/workflows/timeline-extractor-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract sources
        run: |
          rm -rf timeline-build
          mkdir -p timeline-build
          unzip -q build-input/PiiWii-Timeline-Extractor-1.0.0-Sources.zip -d timeline-build
      - name: Build installable APK
        working-directory: timeline-build
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Package output
        run: |
          mkdir -p out
          cp timeline-build/app/build/outputs/apk/debug/app-debug.apk out/PiiWii-Timeline-Extractor-1.0.0.apk
          sha256sum out/PiiWii-Timeline-Extractor-1.0.0.apk > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Timeline-Extractor-1.0.0
          path: out/*
          retention-days: 7
          if-no-files-found: error
