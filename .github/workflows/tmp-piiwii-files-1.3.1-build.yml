name: Temporary PiiWii Files 1.3.1 Build

on:
  push:
    branches:
      - tmp-piiwii-files-1.3.1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct 1.3.0 base project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            tmp-piiwii-files-1.3.0/project.zip.b64.part00 \
            tmp-piiwii-files-1.3.0/project.zip.b64.part01 \
            tmp-piiwii-files-1.3.0/project.zip.b64.fix02.00 \
            tmp-piiwii-files-1.3.0/project.zip.b64.fix02.01 \
            tmp-piiwii-files-1.3.0/project.zip.b64.fix02.02 \
            tmp-piiwii-files-1.3.0/project.zip.b64.fix02.03 \
            tmp-piiwii-files-1.3.0/project.zip.b64.fix02.04 \
            tmp-piiwii-files-1.3.0/project.zip.b64.fix02.05a \
            tmp-piiwii-files-1.3.0/project.zip.b64.fix02.05b \
            tmp-piiwii-files-1.3.0/project.zip.b64.fix02.05c \
            tmp-piiwii-files-1.3.0/project.zip.b64.part03 \
            tmp-piiwii-files-1.3.0/project.zip.b64.part04 \
            tmp-piiwii-files-1.3.0/project.zip.b64.part05 \
            tmp-piiwii-files-1.3.0/project.zip.b64.part06 \
            tmp-piiwii-files-1.3.0/project.zip.b64.part07 \
            > /tmp/piiwii-files.zip.b64
          base64 -d /tmp/piiwii-files.zip.b64 > /tmp/piiwii-files.zip
          echo "4ee4b1e48cb23e39ebc2e3a1f93b645b71b0c89898df6029cdba251e175f5569  /tmp/piiwii-files.zip" | sha256sum -c -
          mkdir -p /tmp/piiwii-files
          unzip -q /tmp/piiwii-files.zip -d /tmp/piiwii-files

      - name: Apply 1.3.1 patch
        shell: bash
        run: |
          set -euo pipefail
          cat tmp-piiwii-files-1.3.1/patch.b64.part* > /tmp/piiwii-files-1.3.1.patch.b64
          base64 -d /tmp/piiwii-files-1.3.1.patch.b64 > /tmp/piiwii-files-1.3.1.patch
          echo "e3b8d5c1219fbc8356e0746c59a63bcd519ffa9c1fa6c502917c90763dbec2a9  /tmp/piiwii-files-1.3.1.patch" | sha256sum -c -
          cd /tmp/piiwii-files
          patch -p0 < /tmp/piiwii-files-1.3.1.patch
          grep -q "versionName '1.3.1'" app/build.gradle
          grep -q 'PiiWii Files", 23' app/src/main/java/ch/piiwii/files/MainActivity.java
          ! grep -q 'Tes fichiers. Sans prise de tête.' app/src/main/java/ch/piiwii/files/MainActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        working-directory: /tmp/piiwii-files
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/piiwii-files/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -l /tmp/piiwii-files/app/build/outputs/apk/release/

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-Files-1.3.1-unsigned
          path: /tmp/piiwii-files/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 1
