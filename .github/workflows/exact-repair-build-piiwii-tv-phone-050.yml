name: Exact repair and build PiiWii TV Phone 0.5.0

on:
  push:
    branches: [ piiwii-tv-phone-050 ]
    paths: ['.github/workflows/exact-repair-build-piiwii-tv-phone-050.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recover exact 0.5.0 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, hashlib, zipfile, io

          D = Path('piiwii-tv-phone-050-ci')
          TARGET_SHA = '631c90b2ec62f65a557421f9aeab1228c8e1190272de4b53cdd3b49a7298ce07'
          TARGET_SIZE = 50167

          def useful(path):
              return ''.join(re.findall(r'[A-Za-z0-9+/=]', Path(path).read_text(errors='ignore')))

          parts = [useful(D / f'src.part{i:02d}') for i in range(9)]
          # Known exact corrections already diagnosed earlier.
          parts[4] = useful(D / 'fix04a') + useful(D / 'fix04b')
          parts[6] = useful(D / 'fix06a') + useful(D / 'fix06b')
          s = ''.join(parts)

          print('Base64 length before final repair:', len(s))
          print('Malformed marker count:', s.count('lIensanV4'))
          assert len(s) == 66895, len(s)
          assert s.count('lIensanV4') == 3, s.count('lIensanV4')

          # The clean original uses lIesanV4 in the ZIP ux extra-field Base64.
          s = s.replace('lIensanV4', 'lIesanV4')
          print('Base64 length after final repair:', len(s))
          assert len(s) == 66892, len(s)

          raw = base64.b64decode(s, validate=True)
          sha = hashlib.sha256(raw).hexdigest()
          print('Recovered ZIP size:', len(raw))
          print('Recovered ZIP SHA-256:', sha)
          assert len(raw) == TARGET_SIZE, len(raw)
          assert sha == TARGET_SHA, sha

          z = zipfile.ZipFile(io.BytesIO(raw))
          bad = z.testzip()
          print('ZIP entries:', len(z.infolist()), 'bad:', bad)
          assert bad is None, bad

          out = Path('/tmp/PiiWii-TV-Phone-0.5.0-Sources.zip')
          out.write_bytes(raw)
          print('EXACT_SOURCE_RECOVERED')
          PY

          rm -rf /tmp/piiwii050src
          mkdir -p /tmp/piiwii050src
          unzip -q /tmp/PiiWii-TV-Phone-0.5.0-Sources.zip -d /tmp/piiwii050src
          PROJECT=$(find /tmp/piiwii050src -type f -path '*/app/build.gradle' -printf '%h\n' | sed 's#/app$##' | head -n1)
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT=$PROJECT"
          grep -n "applicationId\|versionCode\|versionName" "$PROJECT/app/build.gradle"
          grep -q "applicationId 'ch.piiwii.tvphone'" "$PROJECT/app/build.gradle"
          grep -q 'versionCode 5' "$PROJECT/app/build.gradle"
          grep -q "versionName '0.5.0'" "$PROJECT/app/build.gradle"
          if grep -R -n 'android.webkit.WebView\|<WebView' "$PROJECT/app/src/main"; then
            echo 'WebView detected in app source; refusing build.'
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build native APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > gradle.properties
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          mkdir -p out
          cp "$APK" out/PiiWii-TV-Phone-0.5.0.apk
          cp /tmp/PiiWii-TV-Phone-0.5.0-Sources.zip out/PiiWii-TV-Phone-0.5.0-Sources.zip

          unzip -t out/PiiWii-TV-Phone-0.5.0.apk | tee out/unzip.txt
          "$BT/zipalign" -c -v 4 out/PiiWii-TV-Phone-0.5.0.apk | tee out/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs out/PiiWii-TV-Phone-0.5.0.apk | tee out/apksigner.txt
          "$BT/aapt" dump badging out/PiiWii-TV-Phone-0.5.0.apk | tee out/badging.txt

          grep -F "package: name='ch.piiwii.tvphone'" out/badging.txt
          grep -F "versionCode='5'" out/badging.txt
          grep -F "versionName='0.5.0'" out/badging.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' out/apksigner.txt

          sha256sum out/PiiWii-TV-Phone-0.5.0.apk | tee out/PiiWii-TV-Phone-0.5.0.sha256
          sha256sum out/PiiWii-TV-Phone-0.5.0-Sources.zip | tee out/PiiWii-TV-Phone-0.5.0-Sources.sha256
          grep -F '631c90b2ec62f65a557421f9aeab1228c8e1190272de4b53cdd3b49a7298ce07' out/PiiWii-TV-Phone-0.5.0-Sources.sha256

          {
            echo 'PiiWii TV Phone 0.5.0 - audit de livraison'
            echo
            echo 'Source originale exacte récupérée et vérifiée.'
            cat out/PiiWii-TV-Phone-0.5.0-Sources.sha256
            echo
            echo 'APK:'
            cat out/PiiWii-TV-Phone-0.5.0.sha256
            echo
            cat out/badging.txt
            echo
            cat out/apksigner.txt
            echo
            cat out/zipalign.txt
          } > out/PiiWii-TV-Phone-0.5.0-AUDIT.txt

      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Phone-0.5.0-DELIVERY
          path: out/*
          retention-days: 14
          if-no-files-found: error
