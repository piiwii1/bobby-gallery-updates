name: Inspect PiiWii TV 0.6.104 recording JS
on:
  push:
    branches: [ piiwii-tv-phone-050 ]
    paths: [ '.github/workflows/inspect-piiwii-tv-js-record.yml' ]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current plugin JS
        run: |
          set -euo pipefail
          u='https://piiwii.ch/wp-content/plugins/geek-tv/assets/piiwii-tv.js?ver=0.6.104'
          curl -fsSL --max-time 30 "$u" -o /tmp/tv.js
          wc -c /tmp/tv.js
          echo '--- matches ---'
          grep -Ein -C 10 'record|schedule|device|pair|cloud|enregistr|programm' /tmp/tv.js | head -c 100000 || true
