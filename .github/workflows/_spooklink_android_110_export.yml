name: SpookLink Android 1.1.0 APK export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/_spooklink_android_110_export.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> $GITHUB_ENV
          echo '/usr/local/lib/android/sdk/cmdline-tools/latest/bin' >> $GITHUB_PATH
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract verified SpookLink 1.1.0 sources from prior workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, zipfile, io, lzma
          content=Path('.github/workflows/_spooklink_android_1_0_0.yml').read_text()
          z=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > source.zip",content)
          j=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| xz -dc >",content)
          assert z and j, "missing checked source payloads"
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(z.group(1)))) as archive: archive.extractall('.')
          path=Path('android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java')
          path.write_bytes(lzma.decompress(base64.b64decode(j.group(1))))
          config=Path('android/app/build.gradle')
          config.write_text(config.read_text().replace('versionCode 1','versionCode 2').replace("versionName '1.0.0'","versionName '1.1.0'"))
          print('Extracted SpookLink 1.1.0 source')
          PY
      - name: Compile installable APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpookLink-Android-1.1.0.apk
      - name: Export APK
        uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-1.1.0
          path: SpookLink-Android-1.1.0.apk
          if-no-files-found: error
          retention-days: 14
