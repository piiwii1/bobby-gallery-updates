name: Export PiiWii TV Android build environment

on:
  push:
    branches: [ piiwii-tv-phone-050 ]
    paths:
      - '.github/workflows/export-piiwii-tv-build-env.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 35
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore proven 0.4.0 source
        run: |
          set -euo pipefail
          {
            cat piiwii-tv-phone-040-ci/src.part00
            cat piiwii-tv-phone-040-ci/src.part01
            cat piiwii-tv-phone-040-ci/src.part02
            cat piiwii-tv-phone-040-tail/tail.part00
            cat piiwii-tv-phone-040-tail/tail.part01
            cat piiwii-tv-phone-040-tail/tail.part02
            cat piiwii-tv-phone-040-tail/tail.part03
            cat piiwii-tv-phone-040-tail/tail.part04
          } | base64 --decode > /tmp/piiwii-tv-phone-0.4.0.zip
          echo '0c317305987b5d564a4a7732557b57a27feddd36254ed4c33423ac0199a5e6db  /tmp/piiwii-tv-phone-0.4.0.zip' | sha256sum -c -
          unzip -q /tmp/piiwii-tv-phone-0.4.0.zip
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > piiwii-tv-phone-0.4.0/gradle.properties
      - name: Resolve all Android dependencies
        working-directory: piiwii-tv-phone-0.4.0
        run: gradle --no-daemon :app:assembleDebug
      - name: Package offline build environment
        run: |
          set -euo pipefail
          mkdir -p export
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          echo "Gradle home: $GRADLE_HOME"
          tar -C "$GRADLE_HOME" -czf export/gradle-8.9.tgz .
          tar -C "$HOME/.gradle" -czf export/gradle-cache.tgz caches
          tar -C "$ANDROID_HOME" -czf export/android-sdk35.tgz platforms/android-35 build-tools/35.0.0
          sha256sum export/* > export/SHA256SUMS.txt
          ls -lh export
      - name: Upload offline environment
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Android-Offline-Build-Env
          path: export/*
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
