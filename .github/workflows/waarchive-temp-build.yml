name: WAArchive temporary toolchain build

on:
  push:
    branches: [ waarchive-048-temp-build ]
    paths:
      - 'waarchive-temp/**'
      - '.github/workflows/waarchive-temp-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and reconstruct anonymized payload
        shell: bash
        run: |
          set -euo pipefail
          echo '--- remote fragment sizes ---'
          wc -c waarchive-temp/part0*
          echo '--- remote fragment hashes ---'
          sha256sum waarchive-temp/part0*
          echo '--- expected fragment hashes ---'
          echo 'part00 5a23ab38f019bb72297f2fac82ff5b0b444e2e65ef9c72242010457a704cd35c'
          echo 'part01 1725e14a61cc2ce044df0011718b3a2f5214038c900d93a05196bd693ce81141'
          echo 'part02 9fe0dedf4b89a4ccffe2123cdd32693ca3ff0e3e2a02522612adba9704a30386'
          echo 'part03 967b9c4409a711da498d2f14a40d151914d57f48f1c353c59411f354c6821b34'
          echo 'part04 8bb0f9d7ea93bffa31f3fafc0d7f45e7f7adce400dc63c9f15913283352b599e'
          echo 'part05 42fe9e87a4267e8e4e1e31ed305236c6d7ee306b10d4d1a1bde2f7d185f6e753'
          mkdir -p waarchive-temp/src waarchive-temp/output
          cat waarchive-temp/part0* | tr -d '\r\n' | base64 --decode > /tmp/waarchive-public-048.tar.xz
          sha256sum /tmp/waarchive-public-048.tar.xz
          echo "53a8a1236c946fa0b22e0cd6a8824bb0490b13b0772b7665a62d56a6cd26ca9a  /tmp/waarchive-public-048.tar.xz" | sha256sum -c -
          tar -xJf /tmp/waarchive-public-048.tar.xz -C waarchive-temp/src
          test -f waarchive-temp/src/app/build.gradle
          test -f waarchive-temp/src/app/src/main/java/ch/piiwii/waarchive/MainActivityV048.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile anonymized APK
        working-directory: waarchive-temp/src
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Validate compiled APK
        shell: bash
        run: |
          set -euo pipefail
          APK=waarchive-temp/src/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          cp "$APK" waarchive-temp/output/WAArchive-0.4.8-anonymized-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package:|^sdkVersion:|^targetSdkVersion:" | tee waarchive-temp/output/validation.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "name='ch.piiwii.waarchive'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionCode='16'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "versionName='0.4.8'"

      - name: Package portable Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_HOME="$(dirname "$(dirname "$GRADLE_BIN")")"
          mkdir -p /tmp/waarchive-toolchain/gradle /tmp/waarchive-toolchain/android-sdk /tmp/waarchive-toolchain/gradle-user-home
          cp -a "$GRADLE_HOME"/. /tmp/waarchive-toolchain/gradle/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/waarchive-toolchain/android-sdk/build-tools-35.0.0
          cp -a "$ANDROID_HOME/platforms/android-35" /tmp/waarchive-toolchain/android-sdk/platform-35
          cp -a "$ANDROID_HOME/platform-tools" /tmp/waarchive-toolchain/android-sdk/platform-tools
          cp -a "$HOME/.gradle/caches" /tmp/waarchive-toolchain/gradle-user-home/caches
          cp -a "$HOME/.gradle/native" /tmp/waarchive-toolchain/gradle-user-home/native 2>/dev/null || true
          tar -C /tmp -cJf waarchive-temp/output/waarchive-android-toolchain.tar.xz waarchive-toolchain
          sha256sum waarchive-temp/output/* | tee -a waarchive-temp/output/validation.txt

      - name: Upload compiler bundle
        uses: actions/upload-artifact@v4
        with:
          name: waarchive-048-compiler-bundle
          path: waarchive-temp/output/
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
