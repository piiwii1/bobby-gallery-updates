name: Temporary GTI Speedometer 1.4.3 Build

on:
  push:
    branches: [ tmp-gti-speedometer-1.4.3-build ]
    paths:
      - 'tmp-gti-speedometer-143/**'
      - '.github/workflows/tmp-gti-speedometer-143.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild and unpack project
        run: |
          set -euo pipefail
          rm -rf /tmp/gtispeed143
          mkdir -p /tmp/gtispeed143
          cat tmp-gti-speedometer-143/parts/part-*.b64 | base64 -d > /tmp/Compteur-GTI-1.4.3-SOURCE.zip
          echo '56abcd9258291b552f4b5e1fa464cfe43262e922ce15b08b82916f08f51cbb3c  /tmp/Compteur-GTI-1.4.3-SOURCE.zip' | sha256sum -c -
          unzip -q /tmp/Compteur-GTI-1.4.3-SOURCE.zip -d /tmp/gtispeed143
          test -f /tmp/gtispeed143/app/build.gradle
          grep -q "versionName '1.4.3'" /tmp/gtispeed143/app/build.gradle
          grep -q "versionCode 8" /tmp/gtispeed143/app/build.gradle

      - name: Build release APK
        working-directory: /tmp/gtispeed143
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Validate and prepare output
        run: |
          set -euo pipefail
          APK=/tmp/gtispeed143/app/build/outputs/apk/release/app-release-unsigned.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          rm -rf out
          mkdir -p out/apksigner-tool/lib
          cp "$APK" out/Compteur-GTI-1.4.3-UNSIGNED.apk
          "$BT/zipalign" -f -p 4 "$APK" out/Compteur-GTI-1.4.3-ALIGNED-UNSIGNED.apk
          sha256sum out/Compteur-GTI-1.4.3-UNSIGNED.apk out/Compteur-GTI-1.4.3-ALIGNED-UNSIGNED.apk | tee out/SHA256-BUILD.txt
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='ch.piiwii.gtispeed' versionCode='8' versionName='1.4.3'" out/AAPT-BADGING.txt
          cp "$BT/apksigner" out/apksigner-tool/apksigner
          cp "$BT/lib/apksigner.jar" out/apksigner-tool/lib/apksigner.jar
          cp "$BT/zipalign" out/apksigner-tool/zipalign
          chmod +x out/apksigner-tool/apksigner out/apksigner-tool/zipalign
          cp /tmp/Compteur-GTI-1.4.3-SOURCE.zip out/Compteur-GTI-1.4.3-SOURCE.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compteur-GTI-1.4.3-unsigned-build
          path: out/
          retention-days: 1
