name: Temporary GTI Speedometer 1.4.4 Build

on:
  push:
    branches: [ tmp-gti-speedometer-1.4.3-build ]
    paths:
      - 'tmp-gti-speedometer-143/**'
      - '.github/workflows/tmp-gti-speedometer-143.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Rebuild 1.4.3 source and patch to 1.4.4
        run: |
          set -euo pipefail
          rm -rf /tmp/gtispeed144
          mkdir -p /tmp/gtispeed144
          cat tmp-gti-speedometer-143/parts/part-*.b64 | base64 -d > /tmp/Compteur-GTI-1.4.3-SOURCE.zip
          echo '56abcd9258291b552f4b5e1fa464cfe43262e922ce15b08b82916f08f51cbb3c  /tmp/Compteur-GTI-1.4.3-SOURCE.zip' | sha256sum -c -
          unzip -q /tmp/Compteur-GTI-1.4.3-SOURCE.zip -d /tmp/gtispeed144
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/gtispeed144/app/src/main/java/ch/piiwii/gtispeed/MainActivity.java')
          s=p.read_text()
          s=s.replace('scaleSeek.setMax(26); // 80 % -> 106 %, pas de 1 %','scaleSeek.setMax(40); // 80 % -> 120 %, pas de 1 %')
          s=s.replace('80 %  ←  plus petit        •        100 % = taille actuelle        •        106 % = maxi sans découpe','80 %  ←  plus petit        •        100 % = taille actuelle        •        106 % = plein cadre        •        120 % = très grand')
          p.write_text(s)
          p=Path('/tmp/gtispeed144/app/src/main/java/ch/piiwii/gtispeed/GtiPrefs.java')
          s=p.read_text().replace('Math.min(106,p(c).getInt("gauge_scale_percent",100))','Math.min(120,p(c).getInt("gauge_scale_percent",100))').replace('Math.min(106,v)','Math.min(120,v)')
          p.write_text(s)
          p=Path('/tmp/gtispeed144/app/build.gradle')
          s=p.read_text().replace('versionCode 8','versionCode 9').replace("versionName '1.4.3'","versionName '1.4.4'")
          p.write_text(s)
          PY
          grep -q "versionName '1.4.4'" /tmp/gtispeed144/app/build.gradle
          grep -q "versionCode 9" /tmp/gtispeed144/app/build.gradle
          grep -q 'scaleSeek.setMax(40)' /tmp/gtispeed144/app/src/main/java/ch/piiwii/gtispeed/MainActivity.java
          grep -q 'Math.min(120' /tmp/gtispeed144/app/src/main/java/ch/piiwii/gtispeed/GtiPrefs.java

      - name: Build release APK
        working-directory: /tmp/gtispeed144
        run: gradle --no-daemon --stacktrace clean assembleRelease

      - name: Validate and prepare output
        run: |
          set -euo pipefail
          APK=/tmp/gtispeed144/app/build/outputs/apk/release/app-release-unsigned.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          rm -rf out
          mkdir -p out/apksigner-tool/lib
          cp "$APK" out/Compteur-GTI-1.4.4-UNSIGNED.apk
          "$BT/zipalign" -f -p 4 "$APK" out/Compteur-GTI-1.4.4-ALIGNED-UNSIGNED.apk
          "$BT/aapt" dump badging "$APK" | tee out/AAPT-BADGING.txt
          grep -q "package: name='ch.piiwii.gtispeed' versionCode='9' versionName='1.4.4'" out/AAPT-BADGING.txt
          cp "$BT/apksigner" out/apksigner-tool/apksigner
          cp "$BT/lib/apksigner.jar" out/apksigner-tool/lib/apksigner.jar
          cp "$BT/zipalign" out/apksigner-tool/zipalign
          chmod +x out/apksigner-tool/apksigner out/apksigner-tool/zipalign
          cd /tmp/gtispeed144 && zip -qr "$GITHUB_WORKSPACE/out/Compteur-GTI-1.4.4-SOURCE.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum out/Compteur-GTI-1.4.4-UNSIGNED.apk out/Compteur-GTI-1.4.4-ALIGNED-UNSIGNED.apk out/Compteur-GTI-1.4.4-SOURCE.zip | tee out/SHA256-BUILD.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Compteur-GTI-1.4.4-unsigned-build
          path: out/
          retention-days: 1
