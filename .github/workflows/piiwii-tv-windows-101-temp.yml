name: PiiWii TV Windows 1.0.1 Temp Build

on:
  push:
    branches: [ main ]
    paths:
      - '_build/piiwii-tv-windows-1.0.1/**'
      - '.github/workflows/piiwii-tv-windows-101-temp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Decode icon and publish
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE '_build/piiwii-tv-windows-1.0.1'
          $b64 = (Get-Content (Join-Path $dir 'PiiWiiTV.ico.b64') -Raw).Trim()
          [IO.File]::WriteAllBytes((Join-Path $dir 'PiiWiiTV.ico'), [Convert]::FromBase64String($b64))
          Push-Location $dir
          dotnet restore .\PiiWiiTV.csproj
          dotnet publish .\PiiWiiTV.csproj -c Release -r win-x64 --self-contained true -o .\publish /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true
          Pop-Location
          if (!(Test-Path (Join-Path $dir 'publish\PiiWiiTV.exe'))) { throw 'PiiWiiTV.exe non généré' }
      - name: Download WebView2 bootstrapper
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE '_build/piiwii-tv-windows-1.0.1'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile (Join-Path $dir 'MicrosoftEdgeWebview2Setup.exe') -UseBasicParsing
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE '_build/piiwii-tv-windows-1.0.1'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { throw 'ISCC introuvable' }
          & $iscc (Join-Path $dir 'installer.iss')
          if ($LASTEXITCODE -ne 0) { throw 'Compilation Inno Setup échouée' }
          if (!(Test-Path (Join-Path $dir 'output\PiiWii-TV-Setup-1.0.1.exe'))) { throw 'Installateur non généré' }
      - name: Checksums
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE '_build/piiwii-tv-windows-1.0.1'
          $out = Join-Path $dir 'delivery'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item (Join-Path $dir 'output\PiiWii-TV-Setup-1.0.1.exe') $out
          Copy-Item (Join-Path $dir 'publish\PiiWiiTV.exe') (Join-Path $out 'PiiWii-TV-1.0.1-PORTABLE.exe')
          $lines = Get-ChildItem $out -File | ForEach-Object { "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() )  $($_.Name)" }
          $lines | Set-Content (Join-Path $out 'SHA256.txt') -Encoding ascii
          Get-Content (Join-Path $out 'SHA256.txt')
      - name: Upload delivery
        uses: actions/upload-artifact@v4
        with:
          name: PiiWii-TV-Windows-1.0.1-FINAL
          path: _build/piiwii-tv-windows-1.0.1/delivery/*
          if-no-files-found: error
