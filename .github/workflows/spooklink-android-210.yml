name: SpookLink Android 2.1.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spooklink-android-210.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore complete Android 2.1.0 sources
        run: |
          base64 -d spooklink2/build/android-2.1.0.zip.b64 > project.zip
          unzip -q project.zip
          test -s android/app/src/main/res/drawable-nodpi/halloween_sheet.png
          grep -q "versionCode 9" android/app/build.gradle
      - name: Build release APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon
      - name: Upload unsigned APK for stable release signing
        uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-2.1.0-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
