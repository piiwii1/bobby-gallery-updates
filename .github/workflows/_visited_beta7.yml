name: Visited beta7 final build

on:
  push:
    branches: [ main ]
    paths:
      - '_piiwii_visited_build/**'
      - '.github/workflows/_visited_beta7.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Visited beta7 source
        shell: bash
        run: |
          grep -q 'android:label="Visited"' _piiwii_visited_build/app/src/main/AndroidManifest.xml
          grep -q 'android:icon="@drawable/piiwii_visited_icon"' _piiwii_visited_build/app/src/main/AndroidManifest.xml
          grep -q 'android:text="Visited"' _piiwii_visited_build/app/src/main/res/layout/activity_home.xml
          grep -q 'versionCode 7' _piiwii_visited_build/app/build.gradle

      - name: Build unsigned release
        working-directory: _piiwii_visited_build
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign with original Visited update key
        uses: piiwii1/wpab-builds/piiwii-visited@main
        with:
          unsigned_apk: _piiwii_visited_build/app/build/outputs/apk/release/app-release-unsigned.apk
          output_apk: out/Visited-1.0.0-beta7.apk

      - name: Package sources and hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum out/Visited-1.0.0-beta7.apk > out/Visited-1.0.0-beta7.sha256
          rm -rf /tmp/visited-beta7-src
          cp -a _piiwii_visited_build /tmp/visited-beta7-src
          rm -rf /tmp/visited-beta7-src/.gradle /tmp/visited-beta7-src/app/build /tmp/visited-beta7-src/build
          (cd /tmp/visited-beta7-src && zip -qr "$GITHUB_WORKSPACE/out/Visited-1.0.0-beta7-sources.zip" .)
          cat > out/README-REPRISE.txt <<'EOF'
          Visited 1.0.0-beta7 — versionCode 7
          Nom de l'application : Visited
          Home amélioré avec identité visuelle carte/épingle et statistiques enrichies.
          Total de lieux dynamique, pays, villes, Top pays, Top villes, My Maps et ajouts app.
          Navigation Home / Carte / Lieux / Profil, bouton + et paramètres de repères conservés.
          Signé avec la clé de mise à jour d'origine.
          EOF
          rm -rf /tmp/visited-beta7-pack
          mkdir -p /tmp/visited-beta7-pack
          cp out/Visited-1.0.0-beta7.apk /tmp/visited-beta7-pack/
          cp out/Visited-1.0.0-beta7.sha256 /tmp/visited-beta7-pack/
          cp out/Visited-1.0.0-beta7-sources.zip /tmp/visited-beta7-pack/
          cp out/README-REPRISE.txt /tmp/visited-beta7-pack/
          (cd /tmp/visited-beta7-pack && zip -qr "$GITHUB_WORKSPACE/out/Visited-1.0.0-beta7-PACK-REPRISE.zip" .)

      - name: Upload final files
        uses: actions/upload-artifact@v4
        with:
          name: Visited-1.0.0-beta7
          path: out/
          retention-days: 7
          if-no-files-found: error
