name: Visited beta12 preview

on:
  push:
    branches: [ main ]
    paths:
      - '_piiwii_visited_build/**'
      - '.github/workflows/_visited_beta8_preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed debug preview
        working-directory: _piiwii_visited_build
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Package preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out _visited_preview
          APK="_piiwii_visited_build/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" out/Visited-1.0.0-beta12-PREVIEW.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs out/Visited-1.0.0-beta12-PREVIEW.apk
          sha256sum out/Visited-1.0.0-beta12-PREVIEW.apk > out/Visited-1.0.0-beta12-PREVIEW.sha256
          cp out/Visited-1.0.0-beta12-PREVIEW.apk _visited_preview/
          cp out/Visited-1.0.0-beta12-PREVIEW.sha256 _visited_preview/
          git config user.name "ChatGPT Build"
          git config user.email "actions@users.noreply.github.com"
          git add _visited_preview
          if git diff --cached --quiet; then
            echo "Preview already published"
          else
            git commit -m "Publish Visited beta12 preview APK"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Visited-1.0.0-beta12-PREVIEW
          path: out/
          retention-days: 7
          if-no-files-found: error
