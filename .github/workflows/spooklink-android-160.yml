name: SpookLink Android 1.6.0 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/spooklink-android-160.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble SpookLink Android source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64,io,zipfile
          text=Path(".github/workflows/_spooklink_android_1_0_0.yml").read_text()
          match=re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d > source.zip",text)
          assert match, "Base Android project missing"
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(match.group(1)))) as z:z.extractall(".")
          src=Path("spooklink/android/v1.6.0/MainActivity.java")
          assert src.exists()
          dest=Path("android/app/src/main/java/ch/piiwii/spooklink/MainActivity.java")
          dest.write_bytes(src.read_bytes())
          config=Path("android/app/build.gradle")
          config.write_text(config.read_text().replace("versionCode 1","versionCode 7").replace("versionName '1.0.0'","versionName '1.6.0'"))
          PY
      - name: Compile Android APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpookLink-Android-1.6.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SpookLink-Android-1.6.0
          path: SpookLink-Android-1.6.0.apk
          if-no-files-found: error
