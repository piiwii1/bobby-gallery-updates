name: Inspect PiiWii TV schedule payload
on:
  push:
    branches: [ piiwii-tv-phone-050 ]
    paths: ['.github/workflows/inspect-piiwii-tv-schedule.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://piiwii.ch/wp-content/plugins/geek-tv/assets/piiwii-tv.js?ver=0.6.104' -o /tmp/tv.js
          python3 - <<'PY'
          from pathlib import Path
          L=Path('/tmp/tv.js').read_text(errors='ignore').splitlines()
          for needle in ['async function createSchedule','function createSchedule','schedules', 'pair/exchange']:
            hits=[i for i,x in enumerate(L) if needle in x]
            for i in hits[:8]:
              print('\n===',needle,'line',i+1,'===')
              for j in range(max(0,i-15),min(len(L),i+80)): print(f'{j+1}: {L[j]}')
          PY