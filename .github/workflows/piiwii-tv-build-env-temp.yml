name: PiiWii TV Android Build Env Temp

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/piiwii-tv-build-env-temp.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f /usr/local/lib/android/sdk/platforms/android-35/android.jar
          test -x /usr/local/lib/android/sdk/build-tools/35.0.0/aapt2
          echo 'ANDROID_HOME=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
          echo 'ANDROID_SDK_ROOT=/usr/local/lib/android/sdk' >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Warm AGP and Media3 dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/warm/app/src/main/java/test/warm
          printf 'android.useAndroidX=true\n' > /tmp/warm/gradle.properties
          cat > /tmp/warm/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "Warm"
          include(":app")
          EOF
          cat > /tmp/warm/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.7.3" apply false }
          EOF
          cat > /tmp/warm/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android { namespace = "test.warm"; compileSdk = 35; buildToolsVersion = "35.0.0"; defaultConfig { applicationId = "test.warm"; minSdk = 21; targetSdk = 28; versionCode = 1; versionName = "1" } }
          dependencies { implementation("androidx.media3:media3-exoplayer:1.7.1"); implementation("androidx.media3:media3-exoplayer-hls:1.7.1") }
          EOF
          cat > /tmp/warm/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar" /></manifest>
          EOF
          cat > /tmp/warm/app/src/main/java/test/warm/Dummy.java <<'EOF'
          package test.warm; public final class Dummy { public static final String X = "warm"; }
          EOF
          cd /tmp/warm
          gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Package split build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/piiwii-gradle-core/caches /tmp/piiwii-gradle-runtime/caches
          curl -L --fail --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/piiwii-gradle-core/gradle-8.9-bin.zip
          cp -a "$HOME/.gradle/caches/modules-2" /tmp/piiwii-gradle-core/caches/
          cp -a "$HOME/.gradle/caches/8.9" /tmp/piiwii-gradle-runtime/caches/
          for d in jars-* transforms-*; do
            for p in "$HOME/.gradle/caches"/$d; do
              [ -e "$p" ] && cp -a "$p" /tmp/piiwii-gradle-runtime/caches/
            done
          done
          du -sh /tmp/piiwii-gradle-core /tmp/piiwii-gradle-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: piiwii-tv-gradle-core
          path: /tmp/piiwii-gradle-core/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: piiwii-tv-gradle-runtime
          path: /tmp/piiwii-gradle-runtime/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
